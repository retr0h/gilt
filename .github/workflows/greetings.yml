---
name: Greetings

on: [pull_request_target, issues]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      # The month has to come from somewhere. Earlier revisions branched on
      # env.month, which nothing ever set, so the Hacktoberfest message was
      # unreachable even in October.
      - name: Work out the month
        id: when
        run: echo "month=$(date -u +%b)" >> "$GITHUB_OUTPUT"
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >-
            ${{ steps.when.outputs.month == 'Oct'
            && 'Thank you for your first issue! Happy Hacktoberfest!!! 🎃👕🕹️'
            || 'Thank you for your first issue! 😊🕹️' }}
          pr_message: >-
            ${{ steps.when.outputs.month == 'Oct'
            && 'Thank you for contributing to this project. Happy Hacktoberfest!!! 🎃👕🕹️'
            || 'Thank you for contributing to this project! 😊🕹️' }}
