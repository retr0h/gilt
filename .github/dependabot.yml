---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore

  - package-ecosystem: "gomod"
    directory: "examples/go-client/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: ".*"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: "*"
